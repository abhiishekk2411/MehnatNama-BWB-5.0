<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MehnatNama — ऑफ़लाइन मोड (Offline)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #E8F5E9;
      color: #176B45;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 28px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
      color: #0F172A;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #176B45;
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #125234;
    }
    .note {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>आप अभी ऑफ़लाइन हैं</h1>
    <p>इंटरनेट कनेक्शन उपलब्ध नहीं है। आप पहले से लोड किए गए काम देख सकते हैं और नई हाजिरी दर्ज कर सकते हैं जो ऑनलाइन आने पर अपने आप सिंक हो जाएगी।</p>
    <button class="btn" onclick="window.location.reload()">पुनः प्रयास करें (Retry)</button>
    <div class="note">MehnatNama Offline Support • हर दिन का काम, हर रुपये का हिसाब</div>
  </div>
</body>
</html>
